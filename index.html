/* iPhone / narrow-screen layout */
html{ -webkit-text-size-adjust:100%; }
body{overflow-x:hidden; overscroll-behavior-y:contain;}
button,input,select{ -webkit-tap-highlight-color:transparent; }
button{min-height:42px; touch-action:manipulation;}
@media(max-width:600px){
  body{font-size:14px;}
  .app{width:100%;max-width:none;padding:12px 10px calc(88px + env(safe-area-inset-bottom));}
  .top{display:block;margin:0 0 15px;}

  .logo{width:36px;height:36px;border-radius:11px;font-size:20px;flex:0 0 36px;}

  .setrow{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:end;}

  .setrow input,.setrow select{font-size:16px;padding:9px 7px;min-height:42px;}

@media(max-width:380px){

/button></div>`).join('')||'<p class="note">No routines in this muscle group for the selected training level.</p>'}</section>`:''}${selectedMuscleGroup&&selectedMuscleGroup!=='Cardio'?`<input style="width:100%;margin:5px 0 14px" placeholder="Search routines or exercises…" oninput="filterRoutineCards(this.value)">${active?`<section class="card"><div class="row"><div><div class="eyebrow">In progress</div><h3>${esc(active.routine)}</h3></div><button class="primary" onclick="go('workouts')">Return to workout</button></div></section>`:''}${groups.map(g=>{const rs=matchingWorkouts().filter(r=>muscleGroupOf(r)===selectedMuscleGroup&&(r.sourceSheet||r.title||'Custom routines')===g);if(!rs.length)return '';return `<details class="card" data-routine-group open><summary><b>${esc(g)}</b><span class="pill">${rs.length} routines</span></summary><div class="routine-list">${rs.map(r=>`<div class="historyitem" data-routine-card data-search="${esc((r.name+' '+r.exercises.map(e=>e.name).join(' ')).toLowerCase())}"><div class="row"><div><b>${esc(r.name)}</b><div class="note">${r.exercises.length} exercises · ${r.exercises.filter(exerciseAllowed).length} compatible exercises · Workbook row ${r.sourceRow||'—'}</div></div><button class="primary" onclick="start('${encodeURIComponent(r.name)}')">Open</button></div></div>`).join('')}</div></details>`}).join('')}`:''}</div>`}

function exerciseAllowed(e){const gear=inferredExerciseGear(e);const chosen=new Set(getGear());if(!gear)return chosen.has('Other');return chosen.has(gear)||(gear==='Dumbbells'&&chosen.has('Dumbbell'))||(gear==='Dumbbell'&&chosen.has('Dumbbells'))||(gear==='Kettlebell'&&chosen.has('Kettlebells'))||(gear==='Kettlebells'&&chosen.has('Kettlebell'))}
// Workout preferences are a view filter only. Never persist filtered exercises to the routine template.
function sessionExercisesFor(r){const original=WB.routines.find(w=>w.name===r.name);const isWorkbookRoutine=original&&r.kind!=='cardio'&&!r.originalWorkbookName;const source=isWorkbookRoutine&&original.exercises.length>r.exercises.length?original.exercises:r.exercises;return source.filter(e=>r.kind==='cardio'||exerciseAllowed(e))}
// Prefill each fresh session from the workbook target, without changing the routine template.
function recommendedSetValues(e){
 const raw=String(e.target||'').trim();
 const result={weight:'',reps:'',seconds:'',minutes:'',miles:'',steps:''};
 if(!raw)return result;
 const range=raw.match(/(\d+(?:\.\d+)?)\s*[-–—]\s*(\d+(?:\.\d+)?)/);
 const number=range?Number(range[1]):Number((raw.match(/\d+(?:\.\d+)?/)||[])[0]);
 if(!Number.isFinite(number))return result;
 const isTimed=e.mode==='time'||/\b(sec(?:onds?)?|min(?:utes?)?)\b/i.test(raw);
 if(isTimed){
   result.seconds=String(Math.round(number* (/\bmin(?:utes?)?\b/i.test(raw)?60:1)));
 }else if(number>=1&&number<=50){
   result.reps=String(Math.round(number));
 }
 return result;
}
function start(n){if(active&&!confirm('Replace the active workout? It will not be saved as completed.'))return;let r=db.routines.find(x=>x.name===decodeURIComponent(n));if(!r)return;active={id:'WA2-'+String(db.seq++).padStart(6,'0'),routine:r.name,title:r.name,sourceSheet:r.sourceSheet||r.title,bodyweight:db.bodyweight,equipment:db.equipmentByRoutine?.[r.name]||'Other',equipmentMultiplier:1,started:Date.now(),elapsedSec:0,timerRunning:false,timerStartedAt:null,kind:r.kind||'strength',exercises:sessionExercisesFor(r).map(e=>({...structuredClone(e),id:newLocalId(),equipment:e.equipment||(e.weight==='BW'?'Bodyweight':'Other'),equipmentMultiplier:1,sets:Array.from({length:e.sets||1},()=>recommendedSetValues(e))}))};active.exercises.forEach(e=>e.equipmentMultiplier=equipmentForExercise(e));save();tab='workouts';showActiveWorkout=true;render();runTimer()}

function toggleCardioTimer(id){if(!active)return;const e=active.exercises.find(x=>x.id===id);if(!e)return;if(e.cardioTimerRunning){e.cardioElapsedSec=cardioElapsed(e);e.cardioTimerRunning=false;e.cardioTimerStartedAt=null;e.sets[0].minutes=(e.cardioElapsedSec/60).toFixed(2)}else{e.cardioTimerRunning=true;e.cardioTimerStartedAt=Date.now()}save();render()}

function exerciseCard(e,i){if(e.mode==='cardio'){const x=e.sets[0]||{},unit=x.distanceUnit||'miles',distance=x.distance??(unit==='steps'?x.steps:x.miles)??'',running=!!e.cardioTimerRunning;return `<section class="exercise"><div class="row"><div><h3>${esc(e.name)}</h3><div class="note">Cardio activity · excluded from lifted volume</div></div><button class="ghost danger" onclick="removeExercise('${e.id}')">Remove</button></div><div class="fieldgrid"><div><label>Time (minutes)</label><input type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter minutes" value="${esc(x.minutes||'')}" onchange="setVal('${e.id}',0,'minutes',this.value)"></div><div><label>Distance</label><input type="number" min="0" step="${unit==='steps'?'1':'0.01'}" inputmode="decimal" placeholder="${unit==='steps'?'Enter steps':'Enter miles'}" value="${esc(distance)}" onchange="setVal('${e.id}',0,'distance',this.value)"></div><div><label>Distance unit</label><select aria-label="Cardio distance unit" onchange="changeCardioUnit('${e.id}',0,this.value)"><option value="miles" ${unit==='miles'?'selected':''}>Miles</option><option value="steps" ${unit==='steps'?'selected':''}>Steps</option></select></div></div><div class="cardio-timer" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px"><span class="note">Cardio timer</span><strong class="timer" data-cardio-clock="${e.id}" style="font-size:22px">${dur(cardioElapsed(e))}</strong><button class="${running?'':'primary'}" onclick="toggleCardioTimer('${e.id}')">${running?'Ⅱ Pause':'▶ Start'}</button><button class="ghost" onclick="stopCardioTimer('${e.id}')">■ Stop & save time</button></div><p class="note">The timer fills the time field when paused or stopped. You can also enter time manually. Choose miles or steps for distance.</p></section>`}return `<section class="exercise"><div class="row"><div><h3>${esc(e.name)}</h3><div class="note">${e.mode==='time'?'Time-based · enter seconds':(e.weight==='BW'?'Bodyweight movement':'Rep-based · enter weight and reps')}</div></div><div class="toolbar"><button class="ghost" onclick="addSet('${e.id}')">＋ Set</button><button class="ghost danger" onclick="removeExercise('${e.id}')">Remove</button></div></div><div class="fieldgrid" style="margin:9px 0"><div><label>Equipment for this exercise</label>${equipmentSelectExercise(e)}</div></div>${e.sets.map((s,j)=>(s.completed||s.skipped)?'':`<div class="setrow" data-set="${e.id}-${j}"><div class="setnum">${j+1}</div>${e.mode==='time'?`<div><label>Seconds</label><input type="number" min="0" inputmode="numeric" placeholder="sec" value="${esc(s.seconds)}" onchange="setVal('${e.id}',${j},'seconds',this.value)"></div><div><label>Optional note</label><input placeholder="e.g. plank" value="${esc(s.note||'')}" onchange="setVal('${e.id}',${j},'note',this.value)"></div>`:`<div><label>Weight (lbs)</label><input type="number" min="0" step="0.5" inputmode="decimal" placeholder="lbs" value="${esc(s.weight)}" onchange="setVal('${e.id}',${j},'weight',this.value)"></div><div><label>Reps</label><select onchange="setVal('${e.id}',${j},'reps',this.value)"><option value="">Reps</option>${Array.from({length:50},(_,k)=>k+1).map(n=>`<option value="${n}" ${String(s.reps)===String(n)?'selected':''}>${n}</option>`).join('')}</select></div>`}<div class="set-actions"><button type="button" class="status-btn status-yes ${s.completed?'selected':''}" aria-label="Mark set ${j+1} completed" aria-pressed="${!!s.completed}" title="Completed" onclick="markSet('${e.id}',${j},true)">✓</button><button type="button" class="status-btn status-no ${s.skipped?'selected':''}" aria-label="Mark set ${j+1} not completed" aria-pressed="${!!s.skipped}" title="Not completed" onclick="markSet('${e.id}',${j},false)">✕</button></div></div>`).join('')}<div class="setdone-count">${e.sets.filter(x=>x.completed).length} completed · ${e.sets.filter(x=>x.skipped).length} skipped · ${e.sets.filter(x=>!x.completed&&!x.skipped).length} remaining</div></section>`}
function markSet(id,j,completed){if(!active)return;const e=active.exercises.find(x=>x.id===id);if(!e||!e.sets[j])return;const x=e.sets[j];if(completed){if(e.mode==='time'&&!(Number(x.seconds)>0)){alert('Enter seconds before marking this set complete.');return}if(e.mode!=='time'&&!(Number(x.reps)>0&&Number(x.reps)<=50)){alert('Select reps from 1 to 50 before marking this set complete.');return}x.completed=true;x.skipped=false;delete x.skippedAt;x.completedAt=new Date().toISOString();}else{x.completed=false;x.skipped=true;x.skippedAt=new Date().toISOString();delete x.completedAt;}save();render()}

function graphBars(values,unit){const mx=Math.max(1,...values);return `<div class="chart" style="height:165px;gap:5px" role="img" aria-label="Monthly ${esc(unit)}: ${values.map((v,i)=>new Date(2026,i,1).toLocaleDateString('en',{month:'short'})+' '+Math.round(v)).join(', ')}">${values.map((v,i)=>`<div class="barwrap" title="${new Date(2026,i,1).toLocaleDateString('en',{month:'long'})}: ${fmt(v)} ${esc(unit)}"><small>${v?fmt(v):'·'}</small><div class="bar" style="height:${v?Math.max(4,v/mx*105):2}px;background:${unit==='sessions'?'var(--green)':'var(--green2)'}"></div><small>${new Date(2026,i,1).toLocaleDateString('en',{month:'short'})}</small></div>`).join('')}</div>`}

function progress(){let year=new Date().getFullYear(),y=db.sessions.filter(s=>new Date(s.date).getFullYear()===year),months=Array.from({length:12},(_,i)=>y.filter(s=>new Date(s.date).getMonth()===i)),tot=months.map(a=>a.reduce((n,s)=>n+volume(s),0)),max=Math.max(1,...tot),thisMonth=new Date().getMonth(),prev=months[thisMonth-1]||[],cur=months[thisMonth]||[],pv=prev.reduce((a,s)=>a+volume(s),0),cv=cur.reduce((a,s)=>a+volume(s),0),pct=pv?((cv-pv)/pv*100):null;return `<div class="eyebrow">Performance analytics</div><h2>Progress & totals</h2><div class="grid"><section class="card span4"><div class="eyebrow">YTD volume · ${year}</div><div class="big">${fmt(y.reduce((a,s)=>a+volume(s),0))}</div><div class="muted">lbs lifted</div></section><section class="card span4"><div class="eyebrow">YTD sessions</div><div class="big">${y.length}</div><div class="muted">completed workouts</div></section><section class="card span4"><div class="eyebrow">YTD duration</div><div class="big">${dur(y.reduce((a,s)=>a+s.duration,0))}</div><div class="muted">hours : minutes : seconds</div></section><section class="card span12"><div class="eyebrow">YTD cardio activity</div><div class="fieldgrid"><div><div class="metric">${y.reduce((a,s)=>a+s.exercises.filter(e=>e.mode==='cardio').reduce((n,e)=>n+(Number(e.sets?.[0]?.minutes)||0),0),0).toFixed(1)}</div><div class="note">Minutes</div></div><div><div class="metric">${y.reduce((a,s)=>a+s.exercises.filter(e=>e.mode==='cardio').reduce((n,e)=>{const x=e.sets?.[0]||{};return n+(x.distanceUnit==='miles'?Number(x.distance)||0:(x.distanceUnit?0:Number(x.miles)||0));},0),0).toFixed(2)}</div><div class="note">Miles</div></div><div><div class="metric">${fmt(y.reduce((a,s)=>a+s.exercises.filter(e=>e.mode==='cardio').reduce((n,e)=>{const x=e.sets?.[0]||{};return n+(x.distanceUnit==='steps'?Number(x.distance)||0:(x.distanceUnit?0:Number(x.steps)||0));},0),0))}</div><div class="note">Steps</div></div></div></section><section class="card span12"><div class="row"><div><div class="eyebrow">Month-by-month</div><h3>Volume lifted · ${year}</h3></div><span class="pill">lbs</span></div><div class="chart">${tot.map((n,i)=>`<div class="barwrap"><small>${n?fmt(n):''}</small><div class="bar" style="height:${Math.max(2,n/max*100)}%"></div><small>${new Date(year,i,1).toLocaleDateString(undefined,{month:'short'})}</small></div>`).join('')}</div></section><section class="card span6"><div class="eyebrow">Month over month</div><h3>${new Date().toLocaleDateString(undefined,{month:'long'})} vs previous month</h3><div class="row"><div><div class="metric">${fmt(cv)}</div><div class="note">Current month lbs</div></div><div><div class="metric">${fmt(pv)}</div><div class="note">Previous month lbs</div></div></div><p>${pct===null?'Not enough previous-month data to calculate a change.':`${pct>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}% volume change`}</p></section><section class="card span6"><div class="eyebrow">Session totals</div><div class="row"><span>Workouts this month</span><b>${cur.length}</b></div><div class="row"><span>Workouts previous month</span><b>${prev.length}</b></div><div class="row"><span>Average volume / session</span><b>${fmt(y.length?y.reduce((a,s)=>a+volume(s),0)/y.length:0)} lbs</b></div><div class="row"><span>Total timed exercise work</span><b>${dur(y.reduce((a,s)=>a+s.exercises.reduce((n,e)=>n+e.sets.reduce((k,x)=>k+(+x.seconds||0),0),0),0))}</b></div></section><section class="card span12"><div class="eyebrow">Strength training</div><h3>Monthly lifting volume trend</h3>${graphLine(historicalMonths(year).map(x=>x.volume),'lbs')}<p class="note">Strength sessions only · pounds lifted each month.</p></section><section class="card span12"><div class="eyebrow">Consistency</div><h3>Completed sessions by month</h3>${graphBars(historicalMonths(year).map(x=>x.strength+x.cardio),'sessions')}<p class="note">Includes strength and cardio workouts.</p></section><section class="card span12"><div class="eyebrow">Cardio</div><h3>Cardio minutes by let editIndex=null,editDraft=null,editOriginalName=null,removedDraftExercise=null,copyNamingOpen=false;
function editRoutine(n){const idx=db.routines.findIndex(r=>r.name===decodeURIComponent(n));if(idx<0)return;editIndex=idx;editDraft=structuredClone(db.routines[idx]);editOriginalName=db.routines[idx].originalWorkbookName||db.routines[idx].name;removedDraftExercise=null;copyNamingOpen=false;render()}
function cancelRoutineEdit(){editIndex=null;editDraft=null;copyNamingOpen=false;render()}
function draftField(field,value){if(!editDraft)return;editDraft[field]=value}
function draftExercise(i,field,value){if(!editDraft||!editDraft.exercises[i])return;editDraft.exercises[i][field]=field==='sets'?Math.max(1,Math.min(30,Math.round(+value||1))):value}
function moveDraftExercise(i,delta){const j=i+delta;if(j<0||j>=editDraft.exercises.length)return;const [e]=editDraft.exercises.splice(i,1);editDraft.exercises.splice(j,0,e);render()}

function undoDraftRemoval(){if(!removedDraftExercise||!editDraft)return;editDraft.exercises.splice(removedDraftExercise.index,0,removedDraftExercise.exercise);removedDraftExercise=null;render()}

function cancelCopyNaming(){copyNamingOpen=false;render()}
function confirmCopyNaming(){const el=document.getElementById('new-routine-name');if(!el)return;const name=el.value.trim();if(!name){alert('Enter a name for the new routine.');el.focus();return}if(db.routines.some(r=>r.name.toLowerCase()===name.toLowerCase())){alert('That routine name is already in use. Please choose another.');el.focus();return}if(!editDraft.exercises.length||editDraft.exercises.some(e=>!String(e.name||'').trim())){alert('The routine needs at least one named exercise.');return}const next=structuredClone(editDraft);next.name=name;next.originalWorkbookName=null;db.routines.push(next);save();copyNamingOpen=false;editIndex=null;editDraft=null;render()}

function updateBodyweight(v){const n=Number(v);if(!Number.isFinite(n)||n<=0){alert('Enter a bodyweight greater than zero.');render();return;}db.bodyweight=n;save();render()}
// Render active workout as part of workout tab
const _render=render;render=function(){_render();if(tab==='workouts'&&active&&showActiveWorkout)document.getElementById('view').innerHTML=workoutScreen()};render();if(active){if(!active.id)active.id='WA2-'+String(db.seq++).padStart(6,'0');active.exercises.forEach(e=>{if(!e.equipment)e.equipment=e.weight==='BW'?'Bodyweight':'Other';if(!e.equipmentMultiplier)e.equipmentMultiplier=equipmentForExercise(e);if(e.mode==='cardio'&&!e.sets?.length)e.sets=[{minutes:'',distance:'',distanceUnit:'miles'}];if(e.mode==='cardio'&&e.cardioTimerRunning&&!e.cardioTimerStartedAt){e.cardioTimerRunning=false;}if(e.mode==='cardio'&&e.sets?.[0]&&!e.sets[0].distanceUnit){const x=e.sets[0];if(x.steps){x.distance=x.steps;x.distanceUnit='steps'}else if(x.miles){x.distance=x.miles;x.distanceUnit='miles'}else{x.distance='';x.distanceUnit='miles'}}});if(active.bodyweight==null)active.bodyweight=db.bodyweight;save();runTimer();}
